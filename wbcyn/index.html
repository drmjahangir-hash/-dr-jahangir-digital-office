<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>WBCYN e-Office &amp; Administrative Control System</title>

<!-- PWA: this app is part of the JM Digital Office project. The manifest and
     service worker are shared and live at the project root. -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0b3d66">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JM Digital Office">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="../home-nav.css">
<!-- Chart.js: loaded from CDN and cached by the service worker on first successful load,
     so report charts (Legacy Reports tab) keep working offline afterwards. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>

<header class="appheader no-print">
  <div class="header-left">
    <a class="home-link" href="../index.html" title="Back to JM Digital Office">⌂ <span class="home-link-text">JM Digital Office</span></a>
    <h1>WBCYN e-Office &amp; Administrative Control System</h1>
    <p>Official Work Management System — Registrar, WBCYN</p>
  </div>
  <div class="header-right">
    <div class="name" id="headerRegistrarName">Dr. M. Jahangir</div>
    <div class="role" id="headerRegistrarRole">Registrar, WBCYN</div>
  </div>
  <div class="header-actions no-print">
    <button id="wbcynSearchBtn" class="notif-bell" title="Universal Search" aria-label="Universal Search" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:6px 12px;font-size:16px;">🔍</button>
    <!-- Always-visible, header is sticky so this stays reachable even when the
         scrolling bottom nav on narrow screens doesn't show Settings in view. -->
    <button id="wbcynSettingsBtn" class="notif-bell" title="Settings" aria-label="Settings" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:6px 12px;font-size:16px;">⚙️</button>
  </div>
</header>

<nav class="topnav no-print" id="topnav"></nav>

<main id="app"></main>

<nav class="bottomnav no-print" id="bottomnav"></nav>

<div id="modalRoot"></div>
<div id="pwaBannerRoot"></div>

<footer class="small-note no-print">West Bengal Council of Yoga and Naturopathy &middot; Data stored locally on this device &middot; v1.6.2</footer>

<script src="idb.js"></script>
<script src="../sw-update.js"></script>
<script src="../home-nav.js"></script>
<script src="app.js"></script>
</body>
</html>
